
name: Update Pink Activity Graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_activity.py"
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution graph
        run: python scripts/generate_activity.py

      - name: Save updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-6-months.svg
          if git diff --cached --quiet; then
            echo "Activity graph is already up to date."
          else
            git commit -m "chore: update pink activity graph"
            git push
          fi
